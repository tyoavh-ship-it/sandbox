<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Песочница</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f6f6f7;
    color: #1d1d1f;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 720px; padding: 48px 20px 64px; }
  .kicker { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #737378; margin: 0 0 8px; }
  h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.5px; }
  .lead { margin: 0 0 32px; color: #5c5c62; max-width: 56ch; }
  h2 { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #737378; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a {
    display: block;
    padding: 16px 18px;
    background: #fff;
    border: 1px solid #e0e0e4;
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  li a:hover, li a:focus-visible {
    border-color: #b9b9c2;
    box-shadow: 0 6px 20px rgb(0 0 0 / 6%);
    outline: none;
  }
  li a strong { display: block; font-size: 16px; margin-bottom: 2px; }
  li a span { color: #737378; font-size: 13px; }
  footer { margin-top: 40px; color: #8e8e93; font-size: 12px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Sandbox</p>
  <h1>Песочница</h1>
  <p class="lead">Полигон для быстрых экспериментов с дизайном и прототипами. Только демо-данные: здесь ничего не является рабочим продуктом.</p>

  <h2>Эксперименты</h2>
  <ul>
    <li>
      <a href="exp/roadmap-3.11/">
        <strong>Дорожная карта — шаблон 3.11</strong>
        <span>Интерактивная карта, демо-набор из 7 карточек</span>
      </a>
    </li>
  </ul>

  <footer>Добавление эксперимента: папка в <code>exp/</code> + ссылка в этом списке.</footer>
</main>
</body>
</html>
