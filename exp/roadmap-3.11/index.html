<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roadmap 3.11</title><style>*{box-sizing:border-box}body{margin:0;font:12px -apple-system,BlinkMacSystemFont,system-ui;background:#fafafa;color:#1d1d1f}main{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,.tools{display:flex;align-items:center;gap:6px;padding:10px 12px}header div{flex:1}strong{font-size:17px;letter-spacing:-.5px}small{display:block;font-size:9px;letter-spacing:1.5px;color:#737378;margin-bottom:4px}button,select{font:inherit;color:inherit;background:transparent;border:0;padding:8px;cursor:pointer}select{max-width:145px;font-size:11px}.tools{padding-top:0;flex-wrap:wrap}.zoom{display:flex;align-items:center;background:#eaeaee;border-radius:8px;margin-left:auto}.zoom button{font-size:19px}#area{flex:1;min-height:0;touch-action:none;overflow:hidden;border-top:1px solid #dedee3}canvas{display:block;width:100%;height:100%}footer{padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid #dedee3;font-size:10px;color:#737378}#info{display:none;position:absolute;bottom:0;left:0;right:0;max-height:55dvh;overflow:auto;background:#fafafa;border-top:1px solid #dedee3;padding:16px;box-shadow:0 -8px 30px #0001;line-height:1.65}#info button{border:1px solid #dedee3;border-radius:6px}details{position:relative}summary{cursor:pointer;list-style:none;font-size:20px}.menu{position:absolute;right:0;background:#fafafa;border:1px solid #dedee3;border-radius:12px;width:220px;z-index:5}.menu button{display:block;width:100%;text-align:left}body[data-roadmap-error] #dataset-label{color:#a12232}</style><main inert><header><div><small>ROADMAP · 3.11</small><strong>Дорожная карта</strong></div><details><summary>···</summary><div class="menu"><button onclick="save()">Сохранить начальный вид</button><button onclick="restore()">Открыть начальный вид</button><button onclick="setDetailMode('auto')">Вернуть автодетализацию</button><button onclick="setDetailMode('manual')">Свернуть всё</button><button onclick="clearView()">Удалить сохранённый вид</button><button onclick="forecast()">Прогноз трудозатрат</button></div></details><button onclick="restore()">↺</button></header><div class="tools"><select id="style" onchange="draw()"><option value="accent">Акценты</option><option value="mono">Монохром</option><option value="soft">Лёгкий фон</option></select><select id="source"><option value="all">Все источники</option><option value="protocol">Протоколы</option><option value="github">GitHub</option><option value="bitrix">Битрикс24</option></select><select id="project"><option value="all">Все проекты</option><option value="P-HR">HR</option><option value="P-Сервис">Сервис</option></select><select id="view"><option value="stage">По группам</option><option value="function">По функциям</option></select><select id="period"><option value="all">Общий вид</option><option value="current">Рабочий контур</option><option value="history">История</option><option value="month">Ближайший месяц</option></select><select id="mode"><option value="auto">Авто</option><option value="manual">Вручную</option></select><div class="zoom"><button onclick="zoom(.7)">−</button><span id="scale"></span><button onclick="zoom(1.4)">+</button></div></div><div id="area"><canvas id="c"></canvas></div><footer><span>━ История</span><span style="color:#527ba9">● Постановка</span><span style="color:#bba16b">◇ Срок / КТ</span><span style="color:#527ba9">● Повтор</span><span style="color:#669681">● Результат / ✓ Закрыта</span><span>× Не планируется</span><span id="dataset-label">Загрузка данных…</span><span id="count" aria-live="polite"></span></footer><section id="info"></section></main><script>
function startRoadmap(DATA) {

const $=id=>document.getElementById(id),source=$('source'),project=$('project'),view=$('view'),period=$('period'),mode=$('mode'),a=$('area'),c=$('c'),g=c.getContext('2d');const D=86400000,O=Date.UTC(2025,3,1),N=730,H=40,R=30,day=s=>(Date.parse(s)-O)/D;const tasks=Object.fromEntries(DATA.tasks.map(t=>[t.id,t])),stages=Object.fromEntries(DATA.stages.map(t=>[t.id,t.title])),names={protocol:'История поручений',github:'GitHub · рабочий контур',bitrix:'Битрикс24'};const status={open:'Открыта',completed:'Завершена',closed_not_planned:'Не планируется',unknown:'Нет данных',partial_with_limitations:'Частичный результат',in_progress:'В работе'};let W,V,L,p,z=1,offset=0,vertical=0,pins={},rows=[],visible=[];const events=t=>DATA.events.filter(e=>e.task_id===t.id&&e.date).map(e=>({...e,d:day(e.date)}));function build(){rows=[];let ts=DATA.tasks.filter(t=>(source.value==='all'||t.stream===source.value)&&(project.value==='all'||(t.project||'P-HR')===project.value));function add(id,name,depth,t,parent){let r={id,name,depth,t,parent,children:[],ev:t?events(t):[]};rows.push(r);if(parent)parent.children.push(r);return r}function task(t,parent,prefix){let r=add(prefix+t.id,t.title,parent.depth+1,t,parent);ts.filter(v=>v.parent_task_id===t.id).forEach(v=>task(v,r,prefix))}if(view.value==='function'){for(let f of DATA.functions){let r=add(f.id,f.title,0);ts.filter(t=>!t.parent_task_id&&t.feature_ids.includes(f.id)).forEach(t=>task(t,r,f.id))}let rest=ts.filter(t=>!t.parent_task_id&&!t.feature_ids.length);if(rest.length){let r=add('other','Без привязки к функции',0);rest.forEach(t=>task(t,r,'other'))}}else for(let s of ['protocol','github','bitrix']){let list=ts.filter(t=>t.stream===s&&!t.parent_task_id);if(!list.length)continue;let root=s==='bitrix'?null:add(s,s==='protocol'?'Протоколы':'GitHub · HR',0);for(let pr of [...new Set(list.map(t=>t.project||'P-HR'))]){let q=s==='bitrix'?add(s+pr,'Битрикс24 · '+pr,0,null,null):root;for(let st of [...new Set(list.filter(t=>(t.project||'P-HR')===pr).map(t=>t.stage_id))]){let r=add(s+pr+st,stages[st],q.depth+1,null,q);list.filter(t=>t.stage_id===st&&(t.project||'P-HR')===pr).forEach(t=>task(t,r,s))}}}for(let r of rows.slice().reverse()){if(!r.t)r.ev=r.children.flatMap(t=>t.ev);r.min=r.ev.length?Math.min(...r.ev.map(e=>e.d)):null;r.max=r.ev.length?Math.max(...r.ev.map(e=>e.d)):null} $('count').textContent=ts.filter(t=>t.record_type==='task').length+' задач';draw()}
function expanded(r){return pins[r.id]??(mode.value==='auto'&&r.depth<(z<2?0:z<5?1:z<10?2:z<20?3:4)&&(r.min===null||r.max>=offset&&r.min<=offset+N/z))}function shown(r){return !r.parent||shown(r.parent)&&expanded(r.parent)}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function line(x,y,u,v,col){g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(u,v);g.stroke()}function text(t,x,y,col='#1d1d1f',font='11px system-ui'){g.font=font;g.fillStyle=col;g.textBaseline='middle';g.fillText(t,x,y)}function clip(x,y,w,h){g.beginPath();g.rect(x,y,w,h);g.clip()}function fit(t,w){g.font='11px system-ui';if(w<5)return '';if(g.measureText(t).width<=w)return t;while(t&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}function round(x,y,w,h,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,Math.max(1,w),h,Math.min(4,h/2,Math.max(1,w)/2));g.fill()}
function color(r){let q=r;while(q.parent)q=q.parent;return $('style').value==='mono'?'#a5a5ae':({protocol:'#8498b6',github:'#a49bb5','bitrixP-HR':'#8ba99d','bitrixP-Сервис':'#b7a58e'}[q.id]||'#8498b6')}function draw(){if(!W||!V)return;offset=Math.max(0,Math.min(N-N/z,offset));p=(W-L)*z/N;visible=rows.filter(shown);vertical=Math.max(0,Math.min(Math.max(0,visible.length*R-V+H),vertical));let X=d=>L+(d-offset)*p;rect(0,0,W,V,'#fafafa');g.save();clip(0,H,W,V-H);visible.forEach((r,i)=>{let y=H+i*R-vertical;if(!r.depth&&$('style').value==='soft')rect(0,y,W,R,color(r)+'14');line(r.depth?22:0,y+R,W,y+R,r.depth?'#f0f0f2':'#e8e8ec')});g.restore();g.save();clip(L,H,W-L,V-H);for(let m=0;m<=24;m++){let x=X((Date.UTC(2025,3+m,1)-O)/D);line(x,H,x,V,'#dedee3')}let step=p>=23?1:p>=3.8?7:0;if(step)for(let d=Math.floor(offset/step)*step;d<offset+N/z;d+=step)line(X(d),H,X(d),V,'#f0f0f2');visible.forEach((r,i)=>{let y=H+i*R-vertical+R/2;if(y<H-15||y>V+15)return;if(r.min===null){if(r.t)text('Нет дат',L+8,y,'#a0a0a8','9px system-ui');return;}let x=X(r.min),w=X(r.max)-x,s=r.t?.status;if(w>1){round(x,y-(r.depth?3:5),w,r.depth?6:10,s==='completed'?'#86b4a0':color(r)+(r.depth?'38':'65'));if(s==='closed_not_planned'){g.save();g.setLineDash([3,3]);g.strokeStyle='#a5a5ad';g.strokeRect(x,y-5,w,10);g.restore()}}let bins={};r.ev.forEach(e=>(bins[Math.round(X(e.d)/6)]??=[]).push(e));for(let es of Object.values(bins)){let e=es[es.length-1],xx=X(e.d),k=e.kind,col=e.date_kind==='planned'?'#bba16b':k==='result'?'#669681':k==='closed'?(s==='closed_not_planned'?'#737378':'#669681'):'#527ba9';g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.5;g.beginPath();if(e.date_kind==='planned'){g.moveTo(xx,y-5);g.lineTo(xx+5,y);g.lineTo(xx,y+5);g.lineTo(xx-5,y);g.closePath();g.fillStyle='#fafafa';g.fill();g.stroke()}else if(k==='closed'){text(s==='closed_not_planned'?'×':'✓',xx-4,y,col,'bold 13px system-ui')}else{g.arc(xx,y,k==='result'?4.5:3.5,0,Math.PI*2);g.fill()}if(es.length>1&&r.t&&p>8)text('+'+(es.length-1),xx+5,y-9,'#737378','8px system-ui')}});g.restore();g.save();clip(0,H,L,V-H);visible.forEach((r,i)=>{let y=H+i*R-vertical+R/2,x=12+r.depth*12;if(!r.depth)round(4,y-10,3,20,color(r));else{let last=r.parent.children.at(-1)===r;line(x-7,y-R/2,x-7,last?y:y+R/2,'#d5d6dc');line(x-7,y,x,y,'#d5d6dc')}if(r.children.length)text(expanded(r)?'⌄':'›',x,y,pins[r.id]!==undefined?'#527ba9':'#737378');text(fit(r.name,L-x-24),x+12,y,r.t?'#64646d':'#34343b',r.depth?'11px system-ui':'600 11px system-ui');if(r.t)text(r.t.status==='completed'?'✓':r.t.status==='closed_not_planned'?'×':r.t.status==='unknown'?'○':'●',L-12,y,r.t.status==='completed'?'#669681':'#737378')});g.restore();rect(0,0,W,H,'#f1f1f3');g.save();clip(L,0,W-L,H);for(let m=0;m<24;m++){let dt=new Date(Date.UTC(2025,3+m,1)),x=X((dt-O)/D),end=X((Date.UTC(2025,4+m,1)-O)/D),l=Math.max(L,x),rr=Math.min(W,end);if(rr<=l)continue;g.save();clip(l,0,rr-l,H);text(fit(dt.toLocaleDateString('ru',{month:'short',year:'2-digit',timeZone:'UTC'}),rr-l-4),l+3,step?10:20);g.restore();line(x,0,x,H,'#dedee3')}if(step)for(let d=Math.floor(offset/step)*step;d<offset+N/z;d+=step){let x=X(d);text(new Date(O+d*D).getUTCDate(),x+3,30,'#737378','10px system-ui')}g.restore();text('ЗАДАЧИ',12,20,'#737378','600 9px system-ui');line(L,0,L,V,'#dedee3');line(0,H,W,H,'#dedee3');$('scale').textContent=Math.round(z*100)+'%'}
function resize(){W=a.clientWidth;V=a.clientHeight;L=Math.min(210,Math.max(132,W*.38));let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=V*d;g.setTransform(d,0,0,d,0,0);draw()}function zoom(f,x=(W+L)/2){x=Math.max(L,x);let anchor=offset+(x-L)/p;z=Math.max(1,Math.min(150,z*f));offset=anchor-(x-L)/((W-L)*z/N);draw()}function preset(){let v=period.value,pr={all:[0,N],current:[day('2026-11-06'),45],history:[0,620],month:[day('2026-11-25'),31]}[v];offset=pr[0];z=N/pr[1];vertical=0;draw()}function esc(s){return String(s??'нет данных').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function panel(h){$('info').innerHTML='<button style="float:right" onclick="this.parentNode.style.display=&quot;none&quot;">×</button>'+h;$('info').style.display='block'}function card(id){let t=tasks[id];if(!t)return;let rel=DATA.relationships.filter(r=>r.from_id===id||r.to_id===id);panel('<small>'+esc(id+' · '+(t.project||names[t.stream]))+'</small><h3>'+esc(t.title)+'</h3><p>'+esc(status[t.status])+'</p><p>Источник: '+esc(t.source_record_id)+'<br>Прогресс: '+esc(t.progress_percent)+'<br>Срок: '+esc(t.dates.deadline||t.dates.planned_finish)+'</p>'+Object.entries(t.dates).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')+'<h4>События</h4>'+DATA.events.filter(e=>e.task_id===id).map(e=>esc(e.date)+' · '+esc(e.label)+' ('+esc(e.date_kind)+')').join('<br>')+'<h4>Результаты и ограничения</h4>'+[...t.results.map(r=>r.label),...t.limitations,t.audit?.finding,t.execution_note].filter(Boolean).map(esc).join('<br>')+renderSources(t)+'<h4>Связи</h4>'+rel.map(r=>{let other=r.from_id===id?r.to_id:r.from_id;return '<p><button onclick="card(&quot;'+other+'&quot;)">'+other+'</button> '+esc(tasks[other]?.title)+' · '+esc({explicit:'Зафиксированная связь',proposed:'Предложение',inferred:'Сопоставление'}[r.evidence_status])+' · '+esc(r.kind)+'<br>'+esc(r.note)+'</p>'}).join(''))}function forecast(){
  const scenario=DATA.forecast_scenarios?.[0];
  const hours=scenario?.total_effort_hours;
  panel(hours
    ? '<h3>Предварительный прогноз</h3><p>'+esc(hours.min)+'–'+esc(hours.max)+' ч при '+esc(scenario.capacity_hours_per_week)+' ч/нед.</p>'
    : '<h3>Прогноз трудозатрат</h3><p>В этом наборе прогноза нет.</p>');
}
function save(){try{localStorage.setItem('roadmap311',JSON.stringify({z,offset,vertical,pins,source:source.value,project:project.value,view:view.value,period:period.value,mode:mode.value}))}catch(e){alert('Хранилище недоступно')}}function restore(){let s;try{s=JSON.parse(localStorage.getItem('roadmap311'))}catch(e){}if(s){for(let k of ['source','project','view','period','mode'])$(k).value=s[k];({z,offset,vertical,pins}=s)}else{z=1;offset=vertical=0;pins={};source.value=project.value=period.value='all';view.value='stage';mode.value='auto'}build()}new ResizeObserver(resize).observe(a);resize();restore();
function renderSources(task) {
  const links = (task.source_links || []).flatMap(ref => {
    try {
      const url = new URL(ref.url);
      if (url.protocol === 'https:') return ['<p><a href="'+esc(url.href)+'" target="_blank" rel="noopener noreferrer">'+esc(ref.label)+'</a></p>'];
    } catch {}
    return [];
  });
  return links.length ? '<h4>Первоисточники</h4>'+links.join('') : '';
}
Object.assign(window, {
  draw, zoom, card, forecast, restore, save,
  setDetailMode(value) { pins={};mode.value=value;draw(); },
  clearView() { try { localStorage.removeItem('roadmap311'); } catch {} restore(); },
});

}

async function loadRoadmap(){
  const label=document.getElementById('dataset-label');
  try {
    const response=await fetch('./roadmap.json',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json();
    for(const field of ['tasks','events','relationships','stages','functions']){
      if(!Array.isArray(data[field])) throw new Error('Отсутствует массив '+field);
    }
    const ids=new Set(data.tasks.map(task=>task.id));
    if(ids.size!==data.tasks.length || data.tasks.some(task=>typeof task.id!=='string'||!/^[A-Za-z0-9-]+$/.test(task.id))){
      throw new Error('Некорректные идентификаторы задач');
    }
    startRoadmap(data);
    label.textContent=data.dataset_label||'Рабочий срез';
    document.querySelector('main').inert=false;
  } catch (error) {
    document.body.dataset.roadmapError='';
    label.textContent='Карта не загрузилась. Обновите страницу.';
    console.error('Roadmap:',error);
  }
}
loadRoadmap();
</script></html>
